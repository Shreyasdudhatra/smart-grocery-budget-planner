# Render Blueprint Configuration
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: smart-grocery-budget-planner
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
    healthCheckPath: /healthz
    autoDeploy: true
